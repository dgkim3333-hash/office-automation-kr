[project]
name = "office-automation-kr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
outlook = [
    "pywin32>=312 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-rf"  # 실패한 테스트 이름을 요약에 항상 찍는다
pythonpath = ["."]
markers = [
    "office: 실제 워드 · 엑셀(오피스)이 있어야 도는 무설치판 시험",
    "po_test_kit: C:\\PO시험 시험 자료가 있어야 도는 시험",
]
