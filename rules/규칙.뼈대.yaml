# 규칙.yaml (뼈대): 새 작업이 받는 빈 규칙. 아직 채우지 않아 이대로는 실행되지 않는다(실행하면 「규칙.yaml 오류」).
# Code 탭의 Claude 가 이 작업의 예시 파일을 보고 아래 「채울 곳」을 채운다(04 · 05장).
# 다 채운 모양의 예: 저장소의 rules\규칙.예시.yaml (가짜 샘플용).
# 확인: uv run python -m app check <예시 파일> --작업 <번호>  (필드 · 품목 · 검산 표가 나와야 한다)
#
# 구조 (필요한 것만 쓴다)
#
# 시트순서: [Invoice, DM]          누적장부의 탭 순서(선택)
#
# 문서종류:                         PDF 문서 종류마다 하나. 위에서부터 판별한다
#   Invoice:
#     판별키워드: ["Invoice No"]    이 문서에만 있는 글자(하나 이상)
#     번호필드: 인보이스번호         같은 번호는 두 번 처리하지 않는다
#     필드:                         이름: {패턴: "정규식(괄호 하나가 값)", 형식: 날짜 또는 금액}
#     표:                           품목 표: 시작키워드 · 끝키워드 · 행패턴 · 열 · 금액열 · 수량열
#     검산: {소계: 소계, 부대비용: [운임], 합계: 합계금액}
#     파일명: "Invoice_{인보이스번호}.pdf"
#
# 엑셀양식:                         고객이 보낸 엑셀 PO 고객마다 하나(엑셀 입력일 때)
#   ACME:
#     문서종류: PO                  위 문서종류 중 하나(장부 시트 · 필드 목록)
#     판별키워드: ["Buyer:"]
#     머리: {고객PO번호: "오른쪽:PO Number:", 발주일: {칸: "B4", 형식: 날짜}}
#     품목: {머리글: "Part No", 열: {품번: B, 수량: D, 단가: F, 금액: G}, 금액열: [단가, 금액], 수량열: [수량]}
#
# 회사양식:                         출력 방식이 회사양식 · 둘다 일 때
#   파일명: "회사양식_SO입력_{고객PO번호}.xlsx"
#   시트: SO_Upload
#   열: [{이름: Order Date, 값: 머리.발주일}, {이름: Customer Code, 값: 고객마스터.고객코드}]
#
# 아래가 채울 곳이다. 「채울_문서종류」 를 실제 문서 이름으로 바꾸고 판별키워드 · 필드 · 번호필드 · 파일명을 채운다.

문서종류:
  채울_문서종류:
    판별키워드: []
    번호필드: 채울_번호필드
    필드: {}
    파일명: ""
