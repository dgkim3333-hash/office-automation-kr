# 규칙.예시.yaml — samples/03_Invoice_DM_PDF 의 가짜 문서에 맞춘 추출 규칙
# 여러분의 실제 양식에 맞추려면 04장 레시피대로 Claude Code 에 샘플을 보여 주고 이 구조를 채우게 한다.
# 패턴은 Python 정규식. 괄호 ( ) 하나가 값. (?i) 는 대소문자 무시.

# 장부(엑셀) 탭 순서. 아래 문서종류의 순서(= 판별 순서)와 따로 정한다. 맨 앞 탭이 열 때 보인다.
시트순서: [Invoice, DM, PO]

문서종류:

  # DM 을 Invoice 보다 먼저 둔다 — DM 본문에 "Reference Invoice" 가 있어 순서가 뒤면 Invoice 로 오판된다.
  DM:
    판별키워드: ["DEBIT MEMO", "Debit Memo No"]
    번호필드: DM번호
    필드:
      DM번호:      {패턴: "Debit Memo No[.:]?\\s*([A-Z0-9-]+)"}
      발행일:      {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명:      {패턴: "Bill To:[^\\n]*\\n(.+?(?:Co\\., Ltd\\.|Inc\\.|Corp\\.|Ltd\\.))"}
      참조인보이스: {패턴: "Reference Invoice[.:]?\\s*([A-Z0-9-]+)"}
      고객PO번호:  {패턴: "Customer PO[.:]?\\s*([A-Z0-9-]+)"}
      사유:        {패턴: "Reason[.:]?\\s*(.+?)\\n"}
      합계금액:    {패턴: "Total Debit[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Line Item Description"
      끝키워드: "Total Debit"
      행패턴: "^(\\d+)\\s+(\\S+)\\s+(.+?)\\s+(\\d+)\\s+([\\d,]+\\.\\d{2})\\s+([\\d,]+\\.\\d{2})$"
      열: [줄, 품번, 품명, 수량, 단가, 금액]
      금액열: [단가, 금액]
      수량열: [수량]
    파일명: "{고객명}/{발행일:%Y-%m}/DM_{DM번호}.pdf"

  Invoice:
    판별키워드: ["Invoice No"]   # "INVOICE" 만 쓰면 DM 의 "Reference Invoice" 에도 걸린다
    번호필드: 인보이스번호
    필드:
      인보이스번호: {패턴: "Invoice No[.:]?\\s*([A-Z0-9-]+)"}
      발행일:      {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명:      {패턴: "Bill To:[^\\n]*\\n(.+?(?:Co\\., Ltd\\.|Inc\\.|Corp\\.|Ltd\\.))"}
      고객PO번호:  {패턴: "Customer PO[.:]?\\s*([A-Z0-9-]+)"}
      판매오더번호: {패턴: "Sales Order[.:]?\\s*([A-Z0-9-]+)"}
      결제조건:    {패턴: "Payment Terms[.:]?\\s*(Net \\d+|[A-Za-z0-9 ]+?)(?:\\s{2,}|\\s+Incoterms|\\n)"}
      인도조건:    {패턴: "Incoterms[.:]?\\s*([A-Z]{3} [A-Za-z]+)"}
      선적일:      {패턴: "Ship Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      운송사:      {패턴: "Carrier[.:]?\\s*(.+?)\\n"}
      추적번호:    {패턴: "Tracking / AWB[.:]?\\s*(.+?)\\s+ETA"}
      도착예정일:  {패턴: "ETA[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      소계:        {패턴: "Subtotal[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
      운임:        {패턴: "Freight[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
      합계금액:    {패턴: "\\nTotal[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Line Item Description"
      끝키워드: "Subtotal"
      행패턴: "^(\\d+)\\s+(\\S+)\\s+(.+?)\\s+(\\d+)\\s+([\\d,]+\\.\\d{2})\\s+([\\d,]+\\.\\d{2})$"
      열: [줄, 품번, 품명, 수량, 단가, 금액]
      금액열: [단가, 금액]
      수량열: [수량]
    파일명: "{고객명}/{발행일:%Y-%m}/Invoice_{인보이스번호}.pdf"

  # PO 는 고객이 엑셀로 보내므로 PDF 규칙이 아니라 엑셀 규칙이 필요하다 (설계 추가 예정).
  # 아래는 고객 PO 가 PDF 로 올 때를 대비한 자리 표시. 샘플 PDF 는 없다.
  PO:
    판별키워드: ["PURCHASE ORDER", "PO Number"]
    번호필드: 고객PO번호
    필드:
      고객PO번호: {패턴: "PO Number[.:]?\\s*([A-Z0-9-]+)"}
      발주일:     {패턴: "PO Date[.:]?\\s*(\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명:     {패턴: "Buyer[.:]?\\s*(.+?)\\n"}
      합계금액:   {패턴: "Total[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    파일명: "{고객명}/{발주일:%Y-%m}/PO_{고객PO번호}.pdf"
