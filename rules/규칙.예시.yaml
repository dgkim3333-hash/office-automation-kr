# 규칙 예시 — samples/ 의 가짜 ACME 문서용
# 실제로 쓰는 규칙은 작업 폴더의 규칙.yaml 입니다(설치.bat 가 이 파일을 복사해 둡니다).
#
# 문서종류마다
#   판별키워드: 1쪽 글자에 하나라도 있으면 이 종류(대소문자 무시). 위에 적힌 종류부터 검사.
#   번호필드:   중복 판정과 파일 이름에 쓰는 필드. 반드시 필드 안에 있어야 함.
#   필드:       이름: {패턴: "정규식(괄호 안이 값)", 형식: 날짜 또는 금액(선택)}
#   표:         (선택) 시작키워드 줄 다음부터 끝키워드 줄 앞까지를 한 줄씩 열 개수로 쪼갬
#               여러단어열: 단어가 남을 때 몰아 넣을 열(품명처럼 띄어쓰기가 있는 열)
#   파일명:     정리문서/ 아래 경로. {필드이름}, 날짜는 {필드이름:%Y-%m} 처럼 씀

문서종류:
  Invoice:
    판별키워드: ["INVOICE", "Invoice No"]
    번호필드: 인보이스번호
    필드:
      인보이스번호: {패턴: "Invoice No[.:]?\\s*([A-Z0-9-]+)"}
      발행일: {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명: {패턴: "Bill To[.:]?\\s*(.+)"}
      합계금액: {패턴: "Total[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Item"
      끝키워드: "Subtotal"
      열: [품번, 품명, 수량, 단가, 금액]
      여러단어열: 품명
    파일명: "{고객명}/{발행일:%Y-%m}/Invoice_{인보이스번호}.pdf"

  PO:
    판별키워드: ["PURCHASE ORDER", "PO Number"]
    번호필드: PO번호
    필드:
      PO번호: {패턴: "PO Number[.:]?\\s*([A-Z0-9-]+)"}
      발주일: {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명: {패턴: "Bill To[.:]?\\s*(.+)"}
      합계금액: {패턴: "Total[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Item"
      끝키워드: "Subtotal"
      열: [품번, 품명, 수량, 단가, 금액]
      여러단어열: 품명
    파일명: "{고객명}/{발주일:%Y-%m}/PO_{PO번호}.pdf"

  DM:
    판별키워드: ["DEBIT MEMO", "Debit Memo No"]
    번호필드: DM번호
    필드:
      DM번호: {패턴: "Debit Memo No[.:]?\\s*([A-Z0-9-]+)"}
      발행일: {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명: {패턴: "Bill To[.:]?\\s*(.+)"}
      합계금액: {패턴: "Total[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Item"
      끝키워드: "Subtotal"
      열: [품번, 품명, 수량, 단가, 금액]
      여러단어열: 품명
    파일명: "{고객명}/{발행일:%Y-%m}/DM_{DM번호}.pdf"
