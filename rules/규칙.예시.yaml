# 규칙.예시.yaml — samples/03_Invoice_DM_PDF 의 가짜 문서에 맞춘 추출 규칙
# 여러분의 실제 양식에 맞추려면 04장 레시피대로 Claude Code 에 샘플을 보여 주고 이 구조를 채우게 한다.
# 패턴은 Python 정규식. 괄호 ( ) 하나가 값. (?i) 는 대소문자 무시.

# 장부(엑셀) 탭 순서. 아래 문서종류의 순서(= 판별 순서)와 따로 정한다. 맨 앞 탭이 열 때 보인다.
시트순서: [Invoice, DM, PO]

문서종류:

  # DM 을 Invoice 보다 먼저 둔다 — DM 본문에 "Reference Invoice" 가 있어 순서가 뒤면 Invoice 로 오판된다.
  DM:
    판별키워드: ["DEBIT MEMO", "Debit Memo No"]
    번호필드: DM번호
    필드:
      DM번호:      {패턴: "Debit Memo No[.:]?\\s*([A-Z0-9-]+)"}
      발행일:      {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명:      {패턴: "Bill To:[^\\n]*\\n(.+?(?:Co\\., Ltd\\.|Inc\\.|Corp\\.|Ltd\\.))"}
      참조인보이스: {패턴: "Reference Invoice[.:]?\\s*([A-Z0-9-]+)"}
      고객PO번호:  {패턴: "Customer PO[.:]?\\s*([A-Z0-9-]+)"}
      사유:        {패턴: "Reason[.:]?\\s*(.+?)\\n"}
      합계금액:    {패턴: "Total Debit[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Line Item Description"
      끝키워드: "Total Debit"
      행패턴: "^(\\d+)\\s+(\\S+)\\s+(.+?)\\s+(\\d+)\\s+([\\d,]+\\.\\d{2})\\s+([\\d,]+\\.\\d{2})$"
      열: [줄, 품번, 품명, 수량, 단가, 금액]
      금액열: [단가, 금액]
      수량열: [수량]
    파일명: "{고객명}/{발행일:%Y-%m}/DM_{DM번호}.pdf"

  Invoice:
    판별키워드: ["Invoice No"]   # "INVOICE" 만 쓰면 DM 의 "Reference Invoice" 에도 걸린다
    번호필드: 인보이스번호
    필드:
      인보이스번호: {패턴: "Invoice No[.:]?\\s*([A-Z0-9-]+)"}
      발행일:      {패턴: "Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명:      {패턴: "Bill To:[^\\n]*\\n(.+?(?:Co\\., Ltd\\.|Inc\\.|Corp\\.|Ltd\\.))"}
      고객PO번호:  {패턴: "Customer PO[.:]?\\s*([A-Z0-9-]+)"}
      판매오더번호: {패턴: "Sales Order[.:]?\\s*([A-Z0-9-]+)"}
      결제조건:    {패턴: "Payment Terms[.:]?\\s*(Net \\d+|[A-Za-z0-9 ]+?)(?:\\s{2,}|\\s+Incoterms|\\n)"}
      인도조건:    {패턴: "Incoterms[.:]?\\s*([A-Z]{3} [A-Za-z]+)"}
      선적일:      {패턴: "Ship Date[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      운송사:      {패턴: "Carrier[.:]?\\s*(.+?)\\n"}
      추적번호:    {패턴: "Tracking / AWB[.:]?\\s*(.+?)\\s+ETA"}
      도착예정일:  {패턴: "ETA[.:]?\\s*(\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      소계:        {패턴: "Subtotal[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
      운임:        {패턴: "Freight[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
      합계금액:    {패턴: "\\nTotal[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    표:
      시작키워드: "Line Item Description"
      끝키워드: "Subtotal"
      행패턴: "^(\\d+)\\s+(\\S+)\\s+(.+?)\\s+(\\d+)\\s+([\\d,]+\\.\\d{2})\\s+([\\d,]+\\.\\d{2})$"
      열: [줄, 품번, 품명, 수량, 단가, 금액]
      금액열: [단가, 금액]
      수량열: [수량]
    파일명: "{고객명}/{발행일:%Y-%m}/Invoice_{인보이스번호}.pdf"

  # PO 는 고객이 주로 엑셀로 보낸다. 엑셀은 아래 「엑셀양식」으로 읽고, 이 필드 목록은 장부의 PO 시트 열이 된다.
  # 패턴은 고객 PO 가 PDF 로 올 때를 대비한 것이다(샘플 PDF 는 없다).
  PO:
    판별키워드: ["PURCHASE ORDER", "PO Number"]
    번호필드: 고객PO번호
    필드:
      고객PO번호: {패턴: "PO Number[.:]?\\s*([A-Z0-9-]+)"}
      발주일:     {패턴: "PO Date[.:]?\\s*(\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      고객명:     {패턴: "Buyer[.:]?\\s*(.+?)\\n"}
      납기요청일: {패턴: "Requested Delivery[.:]?\\s*(\\d{4}-\\d{2}-\\d{2}|\\d{1,2}/\\d{1,2}/\\d{4})", 형식: 날짜}
      인도조건:   {패턴: "Incoterms[.:]?\\s*([A-Z]{3} [A-Za-z]+)"}
      통화:       {패턴: "Currency[.:]?\\s*([A-Z]{3})"}
      합계금액:   {패턴: "Total[.:]?\\s*\\$?([\\d,]+\\.\\d{2})", 형식: 금액}
    파일명: "{고객명}/{발주일:%Y-%m}/PO_{고객PO번호}.pdf"   # 엑셀이면 확장자는 .xlsx 로 바뀐다

# 고객이 보낸 엑셀 PO 읽는 법. 고객마다 모양이 다르므로 고객별로 하나씩. 위에서부터 판별한다.
# 머리 칸: 셀 주소("B4") 또는 "오른쪽:글자" (그 글자가 쓰인 칸의 바로 오른쪽 칸). 날짜·금액은 {칸: …, 형식: …}
# 품목: 머리글 글자가 있는 줄 바로 아래부터, 품번 칸이 빈 줄 앞까지. 열은 엑셀 열 문자.
엑셀양식:
  ACME:
    문서종류: PO
    판별키워드: ["Buyer:"]
    머리:
      고객PO번호: "오른쪽:PO Number:"
      발주일:     {칸: "오른쪽:PO Date:", 형식: 날짜}
      고객명:     "오른쪽:Buyer:"
      납기요청일: {칸: "오른쪽:Requested Delivery:", 형식: 날짜}
      인도조건:   "오른쪽:Incoterms:"
      통화:       "오른쪽:Currency:"
      합계금액:   {칸: "오른쪽:Total", 형식: 금액}
      납품처:     "오른쪽:Deliver To:"
      담당:       "오른쪽:Buyer Contact:"
    품목:
      머리글: "Supplier Part No"
      열: {줄: A, 품번: B, 품명: C, 수량: D, 단위: E, 단가: F, 금액: G}
      금액열: [단가, 금액]
      수량열: [수량]

  HANIL:
    문서종류: PO
    판별키워드: ["구매발주서"]
    머리:
      고객PO번호: "오른쪽:발주번호"
      발주일:     {칸: "오른쪽:발주일", 형식: 날짜}
      고객명:     "A1"
      납기요청일: {칸: "오른쪽:납기요청일", 형식: 날짜}
      인도조건:   "오른쪽:인도조건"
      통화:       "오른쪽:통화"
      합계금액:   {칸: "오른쪽:합계", 형식: 금액}
      납품처:     "오른쪽:납품처"
      담당:       "오른쪽:담당"
    품목:
      머리글: "품번"
      열: {줄: A, 품번: B, 품명: C, 수량: D, 단위: E, 단가: F, 금액: G}
      금액열: [단가, 금액]
      수량열: [수량]

# 엑셀 PO 를 바꿔 넣을 회사 SO 입력 양식. 품목 한 줄 = 한 행. 열 순서대로 만든다.
# 값: 머리.이름 · 품목.이름 · 고객마스터.열이름 · 줄번호(10, 20, 30…) · 수량x단가 · 고정:글자 · 빈칸
회사양식:
  파일명: "회사양식_SO입력_{고객PO번호}.xlsx"
  시트: SO_Upload
  열:
    - {이름: Order Date,          값: 머리.발주일}
    - {이름: Customer Code,       값: 고객마스터.고객코드}
    - {이름: Customer Name,       값: 머리.고객명}
    - {이름: Customer PO No,      값: 머리.고객PO번호}
    - {이름: Line No,             값: 줄번호}
    - {이름: Part No,             값: 품목.품번}
    - {이름: Description,         값: 품목.품명}
    - {이름: Qty,                 값: 품목.수량}
    - {이름: UoM,                 값: 품목.단위}
    - {이름: Unit Price,          값: 품목.단가}
    - {이름: Ext Price,           값: 수량x단가}
    - {이름: Currency,            값: 머리.통화}
    - {이름: Requested Ship Date, 값: 머리.납기요청일}
    - {이름: Incoterms,           값: 머리.인도조건}
    - {이름: Payment Terms,       값: 고객마스터.결제조건}
    - {이름: Ship-To Address,     값: 머리.납품처}
    - {이름: Customer Contact,    값: 머리.담당}
    - {이름: Entered By,          값: "고정:KR-Branch / D. Lee"}
    - {이름: Remarks,             값: 빈칸}
